name: basura
description: "Smart Waste Classification Mobile App with TensorFlow Lite"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.3
  google_fonts: ^9.0.0
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  lottie: ^3.8.2
  lucide_icons_flutter: ^4.0.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/model/
    - assets/animations/
    - assets/logos/
